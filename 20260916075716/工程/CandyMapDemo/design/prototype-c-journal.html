<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 C · 贴纸手账 —— 萌宠拼拼乐对局界面（真拼图玩法）</title>
<style>
/* ============================================================
   原型 C「贴纸手账」—— 本作专属流派 × 真拼图消除玩法
   玩法：每格一块贴纸碎片（四分之一），拖动换位；同图相邻且位置正确
   即融合（红虚线框提示），凑满正确 2×2 → 消除 + 上方落补 + 连锁。
   ============================================================ */
:root {
  --paper: #FBF4E4;
  --paper-deep: #F1E6CC;
  --kraft: #C89B6D;
  --kraft-dark: #A87B4E;
  --ink: #4A3B2A;
  --ink-soft: #8A7B66;
  --washi-pink: #F4A9B8;
  --washi-blue: #A9C8F4;
  --stamp: #D64545;
  --pencil: #6E6152;
  --shadow: 0 6px 14px rgba(74, 59, 42, .18);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #57503F;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 16px 12px 24px;
  color: var(--ink);
}
.meta { text-align: center; color: #EDE4CD; line-height: 1.6; }
.meta h1 { font-size: 17px; font-weight: 800; }
.meta p { font-size: 12px; opacity: .7; }

.phone {
  width: 390px; height: 780px; flex: none;
  border-radius: 42px; padding: 10px;
  background: linear-gradient(160deg, #6B6350, #3E382B);
  box-shadow: 0 30px 60px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.06);
}
.screen {
  position: relative; width: 100%; height: 100%;
  border-radius: 34px; overflow: hidden;
  background: var(--paper);
  display: flex; flex-direction: column;
}
.screen::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(74,59,42,.025) 3px 4px),
    repeating-linear-gradient(90deg, transparent 0 3px, rgba(74,59,42,.02) 3px 4px),
    radial-gradient(320px 200px at 50% 110%, rgba(74,59,42,.08), transparent 70%);
}
.screen::after {
  content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px;
  background: rgba(214, 69, 69, .25); pointer-events: none;
}
.hand { font-family: "KaiTi", "STKaiti", "楷体", serif; }

/* ---------- HUD ---------- */
.hud {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: auto 1fr auto; align-items: start;
  gap: 10px; padding: 16px 16px 2px 24px;
}
.taped {
  position: relative;
  background: #FFFDF6;
  border: 1px solid #E5D9BC;
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 8px 12px 9px;
}
.taped::before {
  content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%) rotate(-2deg);
  width: 58px; height: 15px; border-radius: 2px;
  background: var(--washi-pink); opacity: .85;
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}
.taped.blue::before { background: var(--washi-blue); }
.taped .cap { font-size: 10px; color: var(--ink-soft); letter-spacing: 1px; }
.taped .num { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
.page-note { position: relative; z-index: 2; text-align: center; padding: 6px 40px 0; font-size: 13px; color: var(--pencil); }
.page-note b { color: var(--ink); }
.timer-taped { width: 78px; height: 78px; position: relative; }
.timer-taped svg { position: absolute; inset: 3px; transform: rotate(-90deg); }
.timer-taped .bg { fill: none; stroke: #E2D5B4; stroke-width: 4; stroke-dasharray: 4 5; stroke-linecap: round; }
.timer-taped .fg { fill: none; stroke: var(--stamp); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
.timer-taped.urgent { animation: jpulse .5s infinite alternate; }
@keyframes jpulse { to { transform: scale(1.05) rotate(1deg); } }
.timer-num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- 星线 ---------- */
.goal { position: relative; z-index: 2; margin: 8px 18px 0 26px; display: flex; align-items: center; gap: 9px; }
.goal .line { flex: 1; position: relative; height: 26px; }
.goal .line .rail {
  position: absolute; left: 0; right: 34px; top: 50%; height: 3px;
  background: repeating-linear-gradient(90deg, #CBBE9E 0 10px, transparent 10px 15px);
}
.goal .pstar {
  position: absolute; top: 50%; width: 26px; height: 26px; border-radius: 50%;
  transform: translateY(-50%); background: #FFFDF6; border: 2px solid #CBBE9E;
  display: grid; place-items: center; font-size: 14px; color: #CBBE9E;
}
.goal .pstar.on { border-color: var(--stamp); color: var(--stamp); background: #FFF3EE; animation: sIn .4s cubic-bezier(.3,1.8,.5,1); }
@keyframes sIn { 50% { transform: translateY(-50%) scale(1.3) rotate(8deg); } }
.goal .pstar:nth-child(2) { left: 30%; }
.goal .pstar:nth-child(3) { left: 62%; }
.goal .pstar:nth-child(4) { right: 0; }
.goal .cap { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }

/* ---------- 棋盘：贴纸页 · 真拼图 ---------- */
.board-wrap { position: relative; z-index: 2; flex: 1; display: grid; place-items: center; padding: 12px 18px 4px 28px; }
.board {
  width: 340px; height: 448px;
  background: #FFFDF6;
  border: 1px solid #E5D9BC;
  border-radius: 10px;
  box-shadow: var(--shadow);
  background-image: radial-gradient(#E3D7B8 1.2px, transparent 1.2px);
  background-size: 24px 24px;
  padding: 10px;
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr);
  gap: 6px;
  touch-action: none;
}
.cell { position: relative; }
.cell.fade .piece { display: none; }
/* 碎片 = 贴纸的白边 + 虚线裁切线 */
.piece {
  position: absolute; inset: 0;
  background: #fff;
  border-radius: 10px;
  border: 2px dashed rgba(74,59,42,.2);
  box-shadow: 0 2px 4px rgba(74,59,42,.16);
  cursor: grab; user-select: none;
}
.piece[data-img="0"] .frag::after { content:""; position:absolute; inset:0; background: rgba(244,169,184,.18); }
.piece[data-img="1"] .frag::after { content:""; position:absolute; inset:0; background: rgba(169,200,244,.18); }
.piece[data-img="2"] .frag::after { content:""; position:absolute; inset:0; background: rgba(167,216,183,.2); }
.piece[data-img="3"] .frag::after { content:""; position:absolute; inset:0; background: rgba(240,214,140,.25); }
.piece[data-img="4"] .frag::after { content:""; position:absolute; inset:0; background: rgba(245,196,150,.2); }
.piece[data-img="5"] .frag::after { content:""; position:absolute; inset:0; background: rgba(203,183,240,.2); }
.frag { position: absolute; inset: 0; overflow: hidden; border-radius: 8px; }
.frag::before { content: attr(data-emoji); position: absolute; font-size: 106px; line-height: 1; z-index: 1; }
.frag[data-pos="0"]::before { left: 0; top: 0; }
.frag[data-pos="1"]::before { right: 0; top: 0; }
.frag[data-pos="2"]::before { left: 0; bottom: 0; }
.frag[data-pos="3"]::before { right: 0; bottom: 0; }
/* 融合提示：红虚线框（贴纸要拼上了） */
.cell.g .piece { border: 2.5px dashed var(--stamp); box-shadow: 0 3px 8px rgba(214,69,69,.28); }
.cell.sel .piece { border: 2.5px solid var(--ink); box-shadow: 0 4px 10px rgba(74,59,42,.3); transform: scale(1.07); }
.cell.lift .piece { opacity: .25; }
.ghost {
  position: fixed; z-index: 999; pointer-events: none;
  transform: scale(1.14) rotate(4deg);
  background: #fff; border-radius: 10px; border: 2px dashed rgba(74,59,42,.3);
  box-shadow: 0 16px 26px rgba(74,59,42,.35);
  overflow: hidden;
}
.cell.zap .piece { animation: czap .48s ease-out forwards; }
@keyframes czap {
  40% { transform: scale(1.12) rotate(3deg); filter: brightness(1.15); }
  100% { transform: scale(0) rotate(-18deg); opacity: 0; }
}
/* 完整贴纸「贴好了」再揭走 */
.full-pop {
  position: absolute; z-index: 8; pointer-events: none;
  transform: translate(-50%, -50%);
  font-size: 110px; line-height: 1;
  filter: drop-shadow(0 8px 12px rgba(74,59,42,.4));
  animation: cfuse .6s cubic-bezier(.3,1.4,.5,1) forwards;
}
@keyframes cfuse {
  0% { transform: translate(-50%, -50%) scale(.5) rotate(-6deg); }
  50% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
  100% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
}
.fly-score {
  position: absolute; z-index: 5; pointer-events: none;
  font-family: "KaiTi", "STKaiti", "楷体", serif;
  font-size: 19px; font-weight: 700; color: var(--stamp);
  animation: cfly .8s ease-out forwards;
}
@keyframes cfly { to { transform: translateY(-52px) rotate(-6deg); opacity: 0; } }
.combo-word {
  position: absolute; z-index: 6; left: 50%; top: 30%;
  transform: translateX(-50%) rotate(-3deg);
  font-family: "KaiTi", "STKaiti", "楷体", serif;
  font-size: 28px; font-weight: 700; color: var(--ink);
  background: #FFF3EE; border: 2px dashed var(--stamp);
  border-radius: 999px; padding: 6px 22px;
  pointer-events: none; animation: ccombo .9s cubic-bezier(.3,1.5,.5,1) forwards;
}
@keyframes ccombo {
  0% { transform: translateX(-50%) rotate(-3deg) scale(.4); }
  50% { transform: translateX(-50%) rotate(2deg) scale(1.06); }
  100% { transform: translateX(-50%) rotate(-3deg) translateY(-24px); opacity: 0; }
}

.hint {
  position: relative; z-index: 2; text-align: center;
  font-family: "KaiTi", "STKaiti", "楷体", serif;
  font-size: 13px; color: var(--pencil);
  padding: 2px 0 4px;
}
.hint b { color: var(--stamp); }

/* ---------- 底栏 ---------- */
.footer {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 22px 14px 28px; font-size: 12px; color: var(--ink-soft);
}
.footer .tag { border: 1.5px solid #CBBE9E; border-radius: 999px; padding: 5px 13px; background: #FFFDF6; }
.footer .energy { display: flex; gap: 5px; align-items: center; border: 1.5px solid #CBBE9E; border-radius: 999px; padding: 5px 13px; background: #FFFDF6; }
.footer b { color: var(--ink); }

/* ---------- 通关：拍立得 ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 10;
  display: none; align-items: center; justify-content: center;
  background: rgba(74, 59, 42, .55); backdrop-filter: blur(3px);
  padding: 20px;
}
.overlay.show { display: flex; animation: jfade .25s; }
@keyframes jfade { from { opacity: 0; } }
.polaroid {
  width: 296px;
  background: #fff;
  padding: 14px 14px 16px;
  border-radius: 4px;
  box-shadow: 0 16px 34px rgba(0,0,0,.35);
  transform: rotate(-2.5deg);
  position: relative;
  text-align: center;
}
.overlay.show .polaroid { animation: pIn .55s cubic-bezier(.25,1.5,.4,1); }
@keyframes pIn {
  0% { transform: rotate(-2.5deg) translateY(60px) scale(.8); opacity: 0; }
  100% { transform: rotate(-2.5deg) translateY(0) scale(1); opacity: 1; }
}
.polaroid::before {
  content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-3deg);
  width: 92px; height: 22px; background: var(--washi-blue); opacity: .9;
  border-radius: 2px; box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.photo {
  background: var(--paper-deep);
  border: 1px solid #E5D9BC;
  aspect-ratio: 5 / 3.6;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  position: relative; overflow: hidden;
}
.photo .pets { display: flex; gap: 10px; font-size: 42px; }
.photo .pets span { animation: petIn .5s cubic-bezier(.3,1.8,.5,1) backwards; }
.photo .pets span:nth-child(2) { animation-delay: .15s; }
.photo .pets span:nth-child(3) { animation-delay: .3s; }
@keyframes petIn { from { transform: scale(0) rotate(-30deg); } }
.photo .stars-line { display: flex; gap: 8px; font-size: 24px; }
.photo .stars-line .s { color: #D8CBA8; }
.photo .stars-line .s.on { color: var(--stamp); animation: sIn2 .5s cubic-bezier(.3,1.8,.5,1) backwards; }
.photo .stars-line .s.on:nth-child(2) { animation-delay: .55s; }
.photo .stars-line .s.on:nth-child(3) { animation-delay: .75s; }
@keyframes sIn2 { 0% { transform: scale(0) rotate(-40deg); } 60% { transform: scale(1.35) rotate(8deg); } }
.photo .cap-hand { font-family: "KaiTi", "STKaiti", "楷体", serif; font-size: 15px; color: var(--pencil); }
.stamp-seal {
  position: absolute; right: 10px; bottom: 8px;
  width: 88px; height: 88px; border-radius: 50%;
  border: 3px solid var(--stamp);
  display: grid; place-items: center;
  color: var(--stamp);
  font-family: "KaiTi", "STKaiti", "楷体", serif;
  font-size: 26px; font-weight: 900; letter-spacing: 2px;
  transform: rotate(-14deg);
  box-shadow: inset 0 0 0 2px rgba(214,69,69,.25);
  opacity: 0;
  background: rgba(255,251,244,.4);
}
.stamp-seal::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1.5px solid rgba(214,69,69,.5); }
.stamp-seal.in { animation: stampIn .35s .95s cubic-bezier(.2,2,.4,1) forwards; }
@keyframes stampIn {
  0% { opacity: 0; transform: rotate(-14deg) scale(2.6); }
  60% { opacity: 1; transform: rotate(-14deg) scale(.92); }
  100% { opacity: .92; transform: rotate(-14deg) scale(1); }
}
.stamp-seal.v2 { font-size: 20px; letter-spacing: 1px; }
.polaroid .under {
  margin-top: 12px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: var(--ink-soft);
}
.polaroid .under .tally-n { font-size: 17px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.polaroid .under .tally-n small { font-size: 10px; color: var(--stamp); font-weight: 800; border: 1px solid var(--stamp); border-radius: 999px; padding: 1px 6px; margin-left: 5px; }
.polaroid .btns { display: flex; gap: 9px; margin-top: 13px; }
.jbtn {
  font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; flex: 1;
  padding: 12px 8px; border-radius: 10px; border: none;
  background: var(--kraft); color: #FFF9EC;
  box-shadow: 0 4px 0 var(--kraft-dark);
  transition: transform .08s, box-shadow .08s;
}
.jbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--kraft-dark); }
.jbtn.ghost { background: #FFFDF6; color: var(--ink-soft); border: 1.5px dashed #CBBE9E; box-shadow: none; font-weight: 600; font-size: 13px; }
.jbtn.ghost:active { background: #F6EED9; transform: none; }

/* ---------- 失败 ---------- */
.fail-page {
  width: 280px; background: #FFFDF6; border-radius: 8px;
  border: 1px solid #E5D9BC; box-shadow: 0 16px 34px rgba(0,0,0,.35);
  padding: 22px 20px 20px; text-align: center; position: relative;
  transform: rotate(1.5deg);
}
.fail-page::before {
  content: ""; position: absolute; top: -9px; left: 34px; transform: rotate(-4deg);
  width: 74px; height: 19px; background: var(--washi-pink); opacity: .9; border-radius: 2px;
}
.fail-emoji { font-size: 46px; }
.fail-title { font-family: "KaiTi", "STKaiti", "楷体", serif; font-size: 24px; font-weight: 700; margin-top: 6px; }
.fail-sub { font-size: 12px; color: var(--ink-soft); margin: 6px 0 14px; line-height: 1.6; }
.revive-card {
  background: var(--paper-deep); border: 1.5px dashed #CBBE9E; border-radius: 10px;
  padding: 12px; display: flex; align-items: center; gap: 12px; text-align: left;
}
.revive-ring { position: relative; width: 60px; height: 60px; flex: none; }
.revive-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.revive-ring .bg { fill: none; stroke: #D8CBA8; stroke-width: 5; stroke-dasharray: 4 4; }
.revive-ring .fg { fill: none; stroke: var(--stamp); stroke-width: 5; stroke-linecap: round; }
.revive-ring .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 800; color: var(--stamp); }
.revive-t { font-size: 14px; font-weight: 800; }
.revive-d { font-size: 11px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }
.revive-ad { display: inline-block; margin-top: 5px; font-size: 10px; font-weight: 800; color: #fff; background: var(--kraft); border-radius: 999px; padding: 2px 8px; }
.fail-page .btns { display: flex; gap: 9px; margin-top: 14px; }

.demo { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 430px; }
.demo button {
  font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer;
  border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
  background: rgba(255,255,255,.1); color: #EDE4CD; padding: 7px 13px;
}
.demo button:hover { background: rgba(255,255,255,.22); }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001s !important; transition-duration: .001s !important; }
}
@media (max-height: 900px) {
  .phone { transform: scale(.86); transform-origin: top center; margin-bottom: -110px; }
}
</style>
</head>
<body>
<div class="meta">
  <h1>原型 C · 贴纸手账（真拼图玩法）</h1>
  <p>拖动碎片换位 · 同图相邻且位置正确即融合（红虚线）· 凑满 2×2 消除落补连锁</p>
</div>

<div class="phone"><div class="screen" id="screen">
  <div class="hud">
    <div class="taped">
      <div class="cap hand">得分</div>
      <div class="num" id="score">0</div>
    </div>
    <div class="page-note hand" style="padding-top:26px">今天也要把<br><b>小可爱们贴满一页</b>呀</div>
    <div class="taped blue timer-taped" id="timerWrap">
      <svg viewBox="0 0 72 72">
        <circle class="bg" cx="36" cy="36" r="31"></circle>
        <circle class="fg" id="timerFg" cx="36" cy="36" r="31"></circle>
      </svg>
      <div class="timer-num hand" id="timerNum">60</div>
    </div>
  </div>

  <div class="goal">
    <span class="cap hand">星线</span>
    <div class="line">
      <div class="rail"></div>
      <div class="pstar" id="ps1">★</div>
      <div class="pstar" id="ps2">★</div>
      <div class="pstar" id="ps3">★</div>
    </div>
    <span class="cap" id="nextGoal">1500</span>
  </div>

  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="hint">拖碎片换位，<b>四块拼成完整贴纸</b>就贴好啦 · 也可以先点一块再点另一块</div>

  <div class="footer">
    <div class="tag hand">简单 · 第 6 关</div>
    <div class="energy">体力 <b>9</b>/10</div>
  </div>

  <!-- 通关：拍立得 -->
  <div class="overlay" id="winOverlay">
    <div class="polaroid">
      <div class="photo">
        <div class="pets"><span>🐰</span><span>🐶</span><span>🐱</span></div>
        <div class="stars-line" id="photoStars">
          <span class="s">★</span><span class="s">★</span><span class="s">★</span>
        </div>
        <div class="cap-hand" id="photoCap">第 6 关 · 简单模式</div>
        <div class="stamp-seal" id="stampSeal">超神</div>
      </div>
      <div class="under">
        <span>本局 <span class="tally-n" id="winScore">0</span></span>
        <span>累计 <span class="tally-n">12,860<small>新纪录</small></span></span>
      </div>
      <div class="btns">
        <button class="jbtn ghost" id="closeWin">回地图</button>
        <button class="jbtn">下一页 ▶</button>
      </div>
    </div>
  </div>

  <!-- 失败 -->
  <div class="overlay" id="failOverlay">
    <div class="fail-page">
      <div class="fail-emoji">✏️</div>
      <div class="fail-title hand">这一页还差一点…</div>
      <div class="fail-sub" id="failInfo">再得 320 分就能摘下第 1 颗星<br>贴纸们等你回来继续</div>
      <div class="revive-card">
        <div class="revive-ring">
          <svg viewBox="0 0 60 60">
            <circle class="bg" cx="30" cy="30" r="25"></circle>
            <circle class="fg" id="reviveFg" cx="30" cy="30" r="25"></circle>
          </svg>
          <div class="n" id="reviveCnt">10</div>
        </div>
        <div>
          <div class="revive-t">续命 30 秒</div>
          <div class="revive-d">已拼好的进度都在，<br>接着刚才的分数继续</div>
          <span class="revive-ad">▶ 看免费广告</span>
        </div>
      </div>
      <div class="btns">
        <button class="jbtn ghost" id="giveUpBtn">回地图</button>
        <button class="jbtn" id="reviveBtn">续命 30 秒</button>
      </div>
    </div>
  </div>
</div></div>

<div class="demo" id="demo">
  <button data-act="stress">⚡ 直达紧张时刻（10s）</button>
  <button data-act="win3">🎉 3 星通关（超神）</button>
  <button data-act="win2">⭐ 2 星通关（王者）</button>
  <button data-act="fail">💀 失败 → 续命</button>
  <button data-act="reset">🔄 重开一局</button>
</div>

<script>
/* ============ 真拼图消除引擎（与 核心/pieces.ts + merge.ts 同规则的原型版） ============ */
const IMG = ['🐶','🐱','🐰','🐼','🦊','🐸'];
const COLS = 5, ROWS = 6;
const GOALS = [1500, 3000, 4500];
const LIMIT = 60;

const board = document.getElementById('board');
const scoreEl = document.getElementById('score');
const timerNum = document.getElementById('timerNum');
const timerFg = document.getElementById('timerFg');
const timerWrap = document.getElementById('timerWrap');
const screen = document.getElementById('screen');
const RING = 2 * Math.PI * 31;
timerFg.style.strokeDasharray = RING;
const reviveFg = document.getElementById('reviveFg');
const RING2 = 2 * Math.PI * 25;
reviveFg.style.strokeDasharray = RING2;

let grid = [];
let score = 0, timeLeft = LIMIT, tick = null, chain = 0, ended = false, inputOn = true;
let selected = -1;
const rnd = n => Math.floor(Math.random() * n);
const cellAt = (r, c) => board.children[r * COLS + c];

const pairH = (a, b) => a.img === b.img && (a.pos === 0 && b.pos === 1 || a.pos === 2 && b.pos === 3);
const pairV = (a, b) => a.img === b.img && (a.pos === 0 && b.pos === 2 || a.pos === 1 && b.pos === 3);

function newQuarter(below) {
  if (below && below.pos >= 2 && Math.random() < .45) return { img: below.img, pos: below.pos - 2 };
  return { img: rnd(IMG.length), pos: rnd(4) };
}

function initGrid() {
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = newQuarter(r > 0 ? grid[r - 1][c] : null);
  for (let k = 0; k < 3; k++) {
    const r0 = rnd(ROWS - 2), c0 = rnd(COLS - 2), img = rnd(IMG.length);
    grid[r0][c0] = { img, pos: 0 };
    grid[r0][c0 + 1] = { img, pos: 1 };
    grid[r0 + 1][c0] = { img, pos: 2 };
    let fr, fc, tries = 0;
    do { fr = rnd(ROWS); fc = rnd(COLS); tries++; } while (tries < 25 && Math.abs(fr - r0) + Math.abs(fc - c0) < 3);
    grid[fr][fc] = { img, pos: 3 };
  }
  let guard = 0;
  while (findGroups().some(g => g.cells.length >= 4) && guard++ < 60) {
    for (const g of findGroups().filter(g => g.cells.length >= 4)) {
      const [r, c] = g.cells[rnd(g.cells.length)];
      grid[r][c] = { img: rnd(IMG.length), pos: rnd(4) };
    }
  }
}

function findGroups() {
  const seen = new Set(), groups = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (seen.has(r * COLS + c) || !grid[r][c]) continue;
    const cells = [[r, c]], stack = [[r, c]];
    seen.add(r * COLS + c);
    while (stack.length) {
      const [cr, cc] = stack.pop();
      for (const [dr, dc, d] of [[0, 1, 'H'], [1, 0, 'V'], [0, -1, 'h'], [-1, 0, 'v']]) {
        const nr = cr + dr, nc = cc + dc;
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || seen.has(nr * COLS + nc) || !grid[nr][nc]) continue;
        const a = grid[cr][cc], b = grid[nr][nc];
        const ok = d === 'H' ? pairH(a, b) : d === 'h' ? pairH(b, a) : d === 'V' ? pairV(a, b) : pairV(b, a);
        if (ok) { seen.add(nr * COLS + nc); stack.push([nr, nc]); cells.push([nr, nc]); }
      }
    }
    if (cells.length > 1) groups.push({ cells, img: grid[r][c].img });
  }
  return groups;
}

function buildBoard() {
  board.innerHTML = '';
  for (let i = 0; i < ROWS * COLS; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.i = i;
    const piece = document.createElement('div');
    piece.className = 'piece';
    const frag = document.createElement('div');
    frag.className = 'frag';
    piece.appendChild(frag);
    cell.appendChild(piece);
    board.appendChild(cell);
  }
}

function render() {
  for (let i = 0; i < ROWS * COLS; i++) {
    const r = Math.floor(i / COLS), c = i % COLS;
    const cell = board.children[i], p = grid[r][c];
    cell.classList.remove('g', 'sel', 'fade', 'zap');
    if (!p) { cell.classList.add('fade'); continue; }
    const piece = cell.firstElementChild;
    piece.dataset.img = p.img;
    const frag = piece.firstElementChild;
    frag.dataset.pos = p.pos;
    frag.dataset.emoji = IMG[p.img];
  }
  paintGroups(findGroups());
}
function paintGroups(groups) {
  for (const g of groups) if (g.cells.length < 4) for (const [r, c] of g.cells) cellAt(r, c).classList.add('g');
}

function eliminate(g) {
  const cr = g.cells.reduce((s, x) => s + x[0], 0) / 4;
  const cc = g.cells.reduce((s, x) => s + x[1], 0) / 4;
  const rect = cellAt(Math.round(cr), Math.round(cc)).getBoundingClientRect();
  const bRect = board.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'full-pop';
  pop.textContent = IMG[g.img];
  pop.style.left = (rect.left - bRect.left + rect.width / 2) + 'px';
  pop.style.top = (rect.top - bRect.top + rect.height / 2) + 'px';
  board.appendChild(pop);
  setTimeout(() => pop.remove(), 640);
  for (const [r, c] of g.cells) {
    cellAt(r, c).classList.add('zap');
    grid[r][c] = null;
  }
  const gain = 300 + (chain - 1) * 100;
  score += gain;
  scoreEl.textContent = score.toLocaleString();
  flyScore('+' + gain, rect.left, rect.top);
  paintGoals();
}
function flyScore(text, x, y) {
  const s = screen.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'fly-score';
  f.textContent = text;
  f.style.left = (x - s.left) + 'px';
  f.style.top = (y - s.top - 2) + 'px';
  screen.appendChild(f);
  setTimeout(() => f.remove(), 800);
}
function showCombo(n) {
  const words = { 2: '拼上了！', 3: '又拼上了！', 4: '妙极了！', 5: '手账大师！' };
  let w = '连锁 x' + n;
  for (const k in words) if (n >= +k) w = words[k];
  const old = document.querySelector('.combo-word');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'combo-word';
  el.textContent = w;
  screen.appendChild(el);
  setTimeout(() => el.remove(), 880);
}

function dropAndRefill() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c]) {
        grid[write][c] = grid[r][c];
        if (write !== r) grid[r][c] = null;
        write--;
      }
    }
    for (let r = write; r >= 0; r--) grid[r][c] = newQuarter(grid[r + 1] ? grid[r + 1][c] : null);
  }
}

function resolve() {
  inputOn = false;
  const step = () => {
    const groups = findGroups();
    const full = groups.filter(g => g.cells.length >= 4);
    if (!full.length) { chain = 0; paintGroups(groups); inputOn = true; return; }
    chain++;
    full.forEach(eliminate);
    if (chain >= 2) showCombo(chain);
    setTimeout(() => {
      dropAndRefill();
      render();
      setTimeout(step, 80);
    }, 480);
  };
  step();
}

/* ---------- 拖动 / 点选 ---------- */
let ghost = null, dragFrom = -1, moved = false;
board.addEventListener('pointerdown', e => {
  if (!inputOn || ended) return;
  const cell = e.target.closest('.cell');
  if (!cell) return;
  dragFrom = +cell.dataset.i;
  moved = false;
  const piece = cell.firstElementChild;
  ghost = piece.cloneNode(true);
  ghost.className = 'ghost';
  const rect = piece.getBoundingClientRect();
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  document.body.appendChild(ghost);
  cell.classList.add('lift');
});
window.addEventListener('pointermove', e => {
  if (!ghost) return;
  moved = true;
  ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + 'px';
  ghost.style.top = (e.clientY - ghost.offsetHeight / 2) + 'px';
});
window.addEventListener('pointerup', e => {
  if (!ghost) return;
  ghost.remove();
  ghost = null;
  const from = dragFrom;
  dragFrom = -1;
  board.querySelectorAll('.lift').forEach(c => c.classList.remove('lift'));
  if (from < 0) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const target = hit && hit.closest ? hit.closest('.cell') : null;
  if (moved && target && target.parentElement === board && +target.dataset.i !== from) {
    selected = -1;
    paintSel();
    swap(from, +target.dataset.i);
    return;
  }
  if (!moved) {
    if (selected < 0 || selected === from) { selected = selected === from ? -1 : from; paintSel(); }
    else { const to = selected; selected = -1; paintSel(); swap(from, to); }
  }
});
function paintSel() {
  board.querySelectorAll('.cell').forEach(c => c.classList.remove('sel'));
  if (selected >= 0) board.children[selected].classList.add('sel');
}
function swap(i, j) {
  const r1 = Math.floor(i / COLS), c1 = i % COLS, r2 = Math.floor(j / COLS), c2 = j % COLS;
  const t = grid[r1][c1];
  grid[r1][c1] = grid[r2][c2];
  grid[r2][c2] = t;
  render();
  resolve();
}

/* ---------- 计分 / 计时 / 结算 ---------- */
function paintGoals() {
  ['ps1', 'ps2', 'ps3'].forEach((id, i) => document.getElementById(id).classList.toggle('on', score >= GOALS[i]));
  const nxt = GOALS.find(g => g > score);
  document.getElementById('nextGoal').textContent = nxt ? nxt.toLocaleString() : 'MAX';
}
function paintTimer() {
  timerNum.textContent = timeLeft;
  timerFg.style.strokeDashoffset = RING * (1 - timeLeft / LIMIT);
  timerWrap.classList.toggle('urgent', timeLeft <= 10);
}
function startTimer() {
  clearInterval(tick);
  timeLeft = LIMIT;
  paintTimer();
  tick = setInterval(() => { timeLeft--; paintTimer(); if (timeLeft <= 0) finish(); }, 1000);
}
const starsOf = () => score >= GOALS[2] ? 3 : score >= GOALS[1] ? 2 : score >= GOALS[0] ? 1 : 0;
function finish() {
  if (ended) return;
  ended = true;
  clearInterval(tick);
  starsOf() >= 1 ? showWin(starsOf()) : showFail();
}
function showWin(st) {
  document.getElementById('winScore').textContent = score.toLocaleString();
  const titles = ['超神', '王者', '优秀'];
  const seal = document.getElementById('stampSeal');
  seal.textContent = titles[st - 1];
  seal.className = 'stamp-seal' + (st < 3 ? ' v2' : '');
  document.querySelectorAll('#photoStars .s').forEach((s, i) => s.classList.toggle('on', i < st));
  const ov = document.getElementById('winOverlay');
  ov.classList.remove('show');
  void ov.offsetWidth;
  ov.classList.add('show');
  seal.classList.remove('in');
  setTimeout(() => seal.classList.add('in'), 60);
}
function showFail() {
  const need = GOALS[0] - score;
  document.getElementById('failInfo').innerHTML = need > 0
    ? `再得 ${need} 分就能摘下第 1 颗星<br>贴纸们等你回来继续` : '差一点点！';
  document.getElementById('failOverlay').classList.add('show');
  let left = 10;
  const paint = () => {
    reviveFg.style.strokeDashoffset = RING2 * (1 - left / 10);
    document.getElementById('reviveCnt').textContent = left;
  };
  paint();
  clearInterval(window._rt);
  window._rt = setInterval(() => { left--; paint(); if (left <= 0) { clearInterval(window._rt); hideFail(); resetGame(); } }, 1000);
}
function hideFail() { clearInterval(window._rt); document.getElementById('failOverlay').classList.remove('show'); }
document.getElementById('reviveBtn').addEventListener('click', () => {
  hideFail();
  ended = false;
  timeLeft += 30;
  paintTimer();
  clearInterval(tick);
  tick = setInterval(() => { timeLeft--; paintTimer(); if (timeLeft <= 0) finish(); }, 1000);
});
document.getElementById('giveUpBtn').addEventListener('click', () => { hideFail(); resetGame(); });
document.getElementById('closeWin').addEventListener('click', resetGame);

function resetGame() {
  ended = false;
  score = 0; chain = 0; selected = -1;
  scoreEl.textContent = '0';
  document.getElementById('winOverlay').classList.remove('show');
  hideFail();
  initGrid();
  render();
  paintGoals();
  startTimer();
}

document.getElementById('demo').addEventListener('click', e => {
  const act = e.target.dataset.act;
  if (!act) return;
  if (act === 'stress') {
    ended = false; clearInterval(tick);
    score = Math.max(score, 900);
    scoreEl.textContent = score.toLocaleString(); paintGoals();
    timeLeft = 10; paintTimer();
    tick = setInterval(() => { timeLeft--; paintTimer(); if (timeLeft <= 0) finish(); }, 1000);
  } else if (act === 'win3') {
    score = GOALS[2] + 600; scoreEl.textContent = score.toLocaleString(); paintGoals(); showWin(3);
  } else if (act === 'win2') {
    score = GOALS[1] + 300; scoreEl.textContent = score.toLocaleString(); paintGoals(); showWin(2);
  } else if (act === 'fail') {
    score = Math.max(200, GOALS[0] - 320); scoreEl.textContent = score.toLocaleString(); paintGoals();
    ended = true; clearInterval(tick); showFail();
  } else if (act === 'reset') resetGame();
});

buildBoard();
resetGame();
</script>
</body>
</html>
